name: Sync fantasy leagues
on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: "2026"
      week:
        description: Optional week
        required: false
      league_id:
        description: ESPN league ID; leave blank to process pending requests
        required: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipelines/ingestion/requirements.txt
      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          SEASON: ${{ inputs.season || '2026' }}
          WEEK: ${{ inputs.week }}
          LEAGUE_ID: ${{ inputs.league_id }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python -m pipelines.ingestion.sync sync-league --season "$SEASON" --all-linked
            python -m pipelines.ingestion.sync sync-league --season "$SEASON" --pending
            exit 0
          fi
          args=(sync-league --season "$SEASON")
          if [ -n "$WEEK" ]; then args+=(--week "$WEEK"); fi
          if [ -n "$LEAGUE_ID" ]; then args+=(--league-id "$LEAGUE_ID"); else args+=(--pending); fi
          python -m pipelines.ingestion.sync "${args[@]}"
