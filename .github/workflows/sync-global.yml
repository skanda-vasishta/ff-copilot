name: Sync global player data
on:
  schedule:
    # Refresh ESPN projections, ranks, ownership, and injury designations every six hours.
    - cron: "17 2 * * *"
    - cron: "17 8 * * *"
    - cron: "17 14 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: "2026"
      week:
        description: Optional week
        required: false
      include_sources:
        description: Scrape source documents
        type: boolean
        default: false
concurrency:
  group: daily-global-ingestion
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipelines/ingestion/requirements.txt
      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESPN_SEED_LEAGUE_ID: ${{ secrets.ESPN_SEED_LEAGUE_ID }}
          REDDIT_CLIENT: ${{ secrets.REDDIT_CLIENT }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          SEASON: ${{ inputs.season || '2026' }}
          WEEK: ${{ inputs.week }}
          SCHEDULE: ${{ github.event.schedule }}
          INCLUDE_SOURCES: ${{ inputs.include_sources || false }}
        run: |
          args=(sync-global --season "$SEASON")
          if [ -n "$WEEK" ]; then args+=(--week "$WEEK"); fi
          # FFToday and source pages are refreshed once daily (08:17 UTC).
          # FFToday is fetched only once per position and visibly attributed in-product.
          if [ "$SCHEDULE" = "17 8 * * *" ] || [ "$INCLUDE_SOURCES" = "true" ]; then
            args+=(--fftoday --fantasypros-rankings --sources --source-player-limit 450)
          fi
          python -m pipelines.ingestion.sync "${args[@]}"
      - name: Verify 2026 coverage
        if: ${{ (inputs.season || '2026') == '2026' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipelines.ingestion.sync coverage-report --season 2026 --minimum-players 250 --maximum-snapshot-age-hours 2
