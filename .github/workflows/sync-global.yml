name: Sync global player data
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: "2026"
      week:
        description: Optional week
        required: false
      include_sources:
        description: Scrape source documents
        type: boolean
        default: false
concurrency:
  group: daily-global-ingestion
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipelines/ingestion/requirements.txt
      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESPN_SEED_LEAGUE_ID: ${{ secrets.ESPN_SEED_LEAGUE_ID }}
          REDDIT_CLIENT: ${{ secrets.REDDIT_CLIENT }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          SEASON: ${{ inputs.season || '2026' }}
          WEEK: ${{ inputs.week }}
          SOURCES: ${{ github.event_name == 'schedule' || inputs.include_sources }}
        run: |
          args=(sync-global --season "$SEASON")
          if [ -n "$WEEK" ]; then args+=(--week "$WEEK"); fi
          if [ "$SOURCES" = "true" ]; then args+=(--sources); fi
          python -m pipelines.ingestion.sync "${args[@]}"
      - name: Verify 2026 coverage
        if: ${{ (inputs.season || '2026') == '2026' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipelines.ingestion.sync coverage-report --season 2026 --minimum-players 250
